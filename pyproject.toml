[project]
name = "totodev-pub"
version = "0.1.1"
description = "Public snapshot of the totodev utility library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ToTo LLC" }]
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "portalocker",
  "click",
  "python-dotenv",
  "sqlitedict",
  "tomli-w",
  "xxhash",
  "transitions>=0.9.3",
]

[project.optional-dependencies]
pipes = [
  "luigi",
]
lucidspark = [
  "networkx",
  "treelib",
]
connectors = [
  "aiofiles",
  "aiohttp",
  "google-api-python-client",
  "google-auth",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "msal",
  "paramiko",
  "pypandoc",
  "requests",
]
llm = [
  "google-auth",
  "jinja2",
  "json-repair",
  # simplified_llm.py uses the legacy 0.x import surface (langchain.prompts,
  # langchain.schema, langchain_community.chat_models); langchain 1.x removed it.
  # Pinned until the planned simplified_llm refactor lands.
  "langchain>=0.3,<1",
  "langchain-community<0.4",
  "langchain-core<0.4",
  "langchain-google-genai",
  "nest-asyncio",
  "openai",
  "requests",
]
git = [
  "GitPython",
]
sweep = [
  "pathspec",
]
# CaseWorkbench marimo skeleton generator only *emits* notebook text (no import
# needed to generate); marimo is required at runtime to open a generated one.
workbench = [
  "marimo",
]
all = [
  "luigi",
  "networkx",
  "treelib",
  "aiofiles",
  "aiohttp",
  "google-api-python-client",
  "google-auth",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "msal",
  "paramiko",
  "pypandoc",
  "requests",
  "jinja2",
  "json-repair",
  # Mirrors the llm extra's langchain pins (see comment there).
  "langchain>=0.3,<1",
  "langchain-community<0.4",
  "langchain-core<0.4",
  "langchain-google-genai",
  "nest-asyncio",
  "openai",
  "GitPython",
  "pathspec",
  "marimo",
]
dev = [
  "marimo",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.scripts]
totodev-manager-health = "totodev_pub.cli.manager_health:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["totodev_pub*"]

[tool.setuptools.package-data]
"totodev_pub" = [
  "**/*.yaml",
  "**/*.yml",
  "**/*.csv",
  "**/*.md",
  "**/*.mdc",
]
